<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Time Tracker</title><meta name="theme-color" content="#080b0e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>
:root{font-family:system-ui,Arial;color:#f4f5f6;background:#101214}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:16px;background:#191c20;position:sticky;top:0;z-index:3;border-bottom:1px solid #41464c}header strong{font-size:20px}main{max-width:760px;margin:auto;padding:14px 14px 90px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1c2024;border-top:1px solid #535960;z-index:4}.tabs button{flex:1;padding:13px 1px;color:#bfc5cc;background:transparent;border:0;font-size:12px}.tabs button.active{color:white;background:#343a40;font-weight:700}.card{background:#252a2f;border:1px solid #444b52;border-radius:12px;padding:14px;margin:10px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;color:white}.item button{background:none;border:0;color:white;text-align:left;flex:1;padding:5px}.muted{color:#b9c0c8;font-size:13px}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.btn{background:#536476;border:1px solid #8290a0;color:white;border-radius:9px;padding:10px 14px;font-weight:650}.btn.secondary{background:#2d3339;border-color:#555d65}.btn.danger{background:#673e42}.pill{padding:7px 10px;border-radius:7px;background:#333a41;border:1px solid #626b74;color:white}.selected{background:#65717d}h2{font-size:19px;margin:12px 0}h3{font-size:15px;margin:10px 0}label{display:block;font-size:13px;color:#cbd0d6;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #646c75;border-radius:8px;background:#171a1d;color:white;color-scheme:dark}textarea{min-height:65px}form{margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.right{text-align:right}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#30363d;border-radius:10px;padding:13px}.stat b{display:block;font-size:23px;margin-top:5px}.entry{padding:10px 0;border-bottom:1px solid #4c535b}.entry:last-child{border:0}.entry button{background:none;color:#b8d2f5;border:0;padding:3px}.tag{font-size:12px;background:#3c434b;border-radius:5px;padding:3px 6px}.sheet{background:#111315;color:#fff;border:1px solid #777d84;border-radius:8px;padding:10px;overflow:auto}.sheet-title{text-align:center;font-weight:700}.sheet-sub{text-align:center;color:#d0d3d6;font-size:12px;margin:5px 0 12px}.timesheet{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.timesheet th,.timesheet td{border:1px solid #737a82;padding:7px 4px;overflow-wrap:anywhere;vertical-align:middle}.timesheet th{background:#151719}.timesheet tr.daydark td{background:#151719}.timesheet tr.daygray td{background:#42464c}.timesheet tr.newday td{border-top:2px solid #b1b6bc}.timesheet tfoot td{background:#555b62;font-weight:700}.timesheet .jobcol{width:39%}.timesheet .timecol{width:18%}.timesheet .hrscol{width:12%}.timesheet .job{font-weight:500}.timesheet .date{font-weight:700;margin-bottom:4px}.timesheet .num{text-align:center;font-weight:650}.notice{background:#343c45;padding:10px;border-radius:8px;font-size:13px;color:#e5e9ee}dialog{width:min(96vw,520px);max-height:90vh;overflow:auto;background:#24292e;color:white;border:1px solid #737b83;border-radius:14px;padding:18px}dialog::backdrop{background:#000b}.checkrow{display:flex;gap:9px;align-items:center;padding:7px 0}.checkrow input{width:auto}.wide{width:100%}@media(max-width:420px){.timesheet{font-size:9px}.timesheet th,.timesheet td{padding:6px 3px}.tabs button{font-size:11px}main{padding-left:9px;padding-right:9px}}
.storagebar{padding:8px 14px;background:#30363d;border-bottom:1px solid #58616b;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.storagebar button{background:#526579;border:1px solid #91a0af;color:#fff;border-radius:6px;padding:7px 10px;font-weight:700}.storagebar.warning{background:#633b31}.storagebar span{flex:1;min-width:160px}</style></head><body><header><strong>Crew Time Tracker</strong><div class="muted">Multi-employee hours • Offline first</div></header><div id="storageBar" class="storagebar"></div><main id="app"></main><nav class="tabs" id="tabs"></nav><dialog id="modal"><div class="row"><h2 id="modalTitle">Edit</h2><button class="pill" onclick="closeModal()">✕</button></div><div id="modalBody"></div></dialog><script>
const KEY='crew-time-tracker-v1';let db,storageError='',lastSaveOk=false;
try{db=JSON.parse(localStorage.getItem(KEY));const probe='crew-storage-probe';localStorage.setItem(probe,'ok');if(localStorage.getItem(probe)!=='ok')throw Error('Storage verification failed');localStorage.removeItem(probe)}catch(e){storageError=String(e.message||e)}
db=db&&Array.isArray(db.employees)?db:{employees:[],jobs:[],entries:[],settings:{weekStart:3}};db.settings=db.settings||{};db.settings.weekStart=Number.isInteger(Number(db.settings.weekStart))&&Number(db.settings.weekStart)>=0&&Number(db.settings.weekStart)<=6?Number(db.settings.weekStart):3;let tab='Jobs',detail=null,employeeView='date',periodShift=0,entryFilter='',jobFilter='',timer=null;const $=id=>document.getElementById(id);const save=()=>{try{let serialized=JSON.stringify(db);localStorage.setItem(KEY,serialized);if(localStorage.getItem(KEY)!==serialized)throw Error('Read-back verification failed');lastSaveOk=true;storageError='';updateSaveStatus();return true}catch(e){lastSaveOk=false;storageError=String(e.message||e);updateSaveStatus();alert('SAVE NOT VERIFIED. Export a backup now from the top of the app. Your entries may disappear after closing.');return false}};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateStr=d=>{let [y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmtTime=t=>t?t.replace(':',''):'';const hrs=e=>{let [a,b]=[e.start,e.end].map(t=>{let [h,m]=t.split(':').map(Number);return h*60+m});return Math.max(0,(b-a+(b<a?1440:0))/60)};const num=n=>Number(n.toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2});const total=arr=>num(arr.reduce((s,e)=>s+hrs(e),0));const emp=id=>db.employees.find(e=>e.id===id);const job=id=>db.jobs.find(j=>j.id===id);const jname=j=>j?j.name+(j.address?', '+j.address:''):'(Deleted job)';const entries=()=>[...db.entries].sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));const byDate=arr=>arr.reduce((o,e)=>{(o[e.date]??=[]).push(e);return o},{});const nowHM=()=>new Date().toTimeString().slice(0,5);
function updateSaveStatus(){const bar=document.getElementById('storageBar');if(!bar)return;const fileMode=location.protocol==='file:'||location.protocol==='content:';bar.className='storagebar'+(storageError||fileMode?' warning':'');const message=storageError?'Storage unavailable: data may not survive closing.':fileMode?'Downloaded-file mode: storage may reset when reopened. Back up before closing.':lastSaveOk?'Saved in browser storage (not a permanent backup).':'Browser storage available. Make backups regularly.';bar.innerHTML='<span>'+esc(message)+'</span><button onclick="backup()">⬇ Backup Now</button>'}
function showModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}function closeModal(){$('modal').close()}
function render(){updateSaveStatus();const tabs=['Jobs','Entries','Periods','Employees','More'];$('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${{Jobs:'▣',Entries:'☷',Periods:'▦',Employees:'♙',More:'⚙'}[t]}<br>${t}</button>`).join('');if(detail){renderDetail();return}({Jobs:renderJobs,Entries:renderEntries,Periods:renderPeriods,Employees:renderEmployees,More:renderMore})[tab]()}function go(t){tab=t;detail=null;render()};function openDetail(type,uid){detail={type,id:uid};render()}function back(){detail=null;render()}
function renderJobs(){ $('app').innerHTML=`<div class="row"><h2>Jobs</h2><button class="btn" onclick="jobForm()">+ Job</button></div><p class="muted">Select a job to view its hours or record time.</p>${db.jobs.length?db.jobs.map(j=>`<div class="card item"><button onclick="openDetail('job','${j.id}')"><b>${esc(j.name)}</b><div class="muted">${esc(j.address||'No address')}</div><div class="small">${total(db.entries.filter(e=>e.jobId===j.id))} hrs recorded</div></button><span>›</span></div>`).join(''):'<div class="notice">Start by adding a job and an employee.</div>'}`}
function renderEmployees(){$('app').innerHTML=`<div class="row"><h2>Employees</h2><button class="btn" onclick="employeeForm()">+ Employee</button></div>${db.employees.map(e=>`<div class="card item"><button onclick="openDetail('employee','${e.id}')"><b>${esc(e.name)}</b><div class="muted">${e.archived?'Archived • ':''}View profile and work history</div></button><span>›</span></div>`).join('')||'<div class="notice">Add your first employee.</div>'}`}
function renderDetail(){if(detail.type==='job'){let j=job(detail.id);if(!j)return back();let es=entries().filter(e=>e.jobId===j.id);$('app').innerHTML=`<button class="pill" onclick="back()">← Jobs</button><div class="row"><h2>${esc(j.name)}</h2><button class="pill" onclick="jobForm('${j.id}')">Edit</button></div><div class="muted">${esc(j.address||'')} ${j.notes?'<br>'+esc(j.notes):''}</div><div class="card"><div class="row"><b>All-time job hours</b><strong>${total(es)} hrs</strong></div>${db.employees.map(p=>`<div class="row muted"><span>${esc(p.name)}</span><span>${total(es.filter(e=>e.employeeId===p.id))} hrs</span></div>`).join('')}</div><div class="actions"><button class="btn" onclick="entryForm(null,'${j.id}')">◷ + Add Hours</button><button class="btn secondary" onclick="startClock('${j.id}')">Clock In Now</button></div><h3>Job History</h3>${history(es,'job')}`;return}let p=emp(detail.id);if(!p)return back();let es=entries().filter(e=>e.employeeId===p.id);let jobs=new Set(es.map(e=>e.jobId));$('app').innerHTML=`<button class="pill" onclick="back()">← Employees</button><div class="row"><h2>${esc(p.name)}</h2><button class="pill" onclick="employeeForm('${p.id}')">Edit Profile</button></div><div class="card"><div class="muted">${esc(p.phone||'No phone')} ${p.email?' • '+esc(p.email):''}</div>${p.notes?`<p>${esc(p.notes)}</p>`:''}</div><div class="grid2"><div class="stat"><span class="muted">All-time hours</span><b>${total(es)}</b></div><div class="stat"><span class="muted">Jobs worked</span><b>${jobs.size}</b></div></div><h3>Work History</h3><div class="row"><button class="pill ${employeeView==='date'?'selected':''}" onclick="employeeView='date';render()">By Date</button><button class="pill ${employeeView==='job'?'selected':''}" onclick="employeeView='job';render()">By Job</button></div><label>Filter by job</label><select onchange="jobFilter=this.value;render()"><option value="">All jobs</option>${db.jobs.map(j=>`<option value="${j.id}" ${jobFilter===j.id?'selected':''}>${esc(jname(j))}</option>`).join('')}</select>${history(es.filter(e=>!jobFilter||e.jobId===jobFilter),employeeView)}`}
function history(es,group){
 if(!es.length)return '<div class="notice">No time entries yet.</div>';
 const isJobHistory=detail?.type==='job';
 const keys=(group==='date'||isJobHistory)?e=>e.date:e=>e.jobId;
 let grouped={};es.forEach(e=>(grouped[keys(e)]??=[]).push(e));
 return Object.entries(grouped).sort((a,b)=>group==='date'||isJobHistory?b[0].localeCompare(a[0]):0).map(([key,items])=>`<div class="card"><div class="row"><b>${esc(group==='date'||isJobHistory?dateStr(key):jname(job(key)))}</b><b>${total(items)} hrs</b></div>${items.map(e=>`<div class="entry"><div class="row"><div>${isJobHistory?`<div><b>${esc(emp(e.employeeId)?.name||'Unknown')}</b></div>`:`<div>${esc(group==='date'?jname(job(e.jobId)):dateStr(e.date))}</div>`}<div class="muted">${fmtTime(e.start)}–${fmtTime(e.end)}${e.comment?' • '+esc(e.comment):''}</div></div><div class="right"><b>${num(hrs(e))} hrs</b><br><button onclick="entryForm('${e.id}')">Edit</button></div></div></div>`).join('')}</div>`).join('')
}
function jobForm(uid){let j=job(uid)||{};showModal(uid?'Edit Job':'New Job',`<form onsubmit="saveJob(event,'${uid||''}')"><label>Job name *</label><input name="name" required value="${esc(j.name||'')}" placeholder="e.g. 500 Forest Rd"><label>Address / city (optional)</label><input name="address" value="${esc(j.address||'')}" placeholder="Fayetteville, NC"><label>Notes (optional)</label><textarea name="notes">${esc(j.notes||'')}</textarea><div class="actions"><button class="btn" type="submit">Save Job</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`)}function saveJob(ev,uid){ev.preventDefault();let f=new FormData(ev.target),o={name:f.get('name').trim(),address:f.get('address').trim(),notes:f.get('notes').trim()};if(uid)Object.assign(job(uid),o);else db.jobs.push({id:id(),...o});save();closeModal();render()}
function employeeForm(uid){let p=emp(uid)||{};showModal(uid?'Edit Employee Profile':'Add Employee',`<form onsubmit="saveEmployee(event,'${uid||''}')"><label>Employee name *</label><input name="name" required value="${esc(p.name||'')}"><label>Phone (optional)</label><input name="phone" type="tel" value="${esc(p.phone||'')}"><label>Email (optional)</label><input name="email" type="email" value="${esc(p.email||'')}"><label>Notes (optional)</label><textarea name="notes">${esc(p.notes||'')}</textarea>${uid?`<label class="checkrow"><input type="checkbox" name="archived" ${p.archived?'checked':''}> Archive employee (preserve all hours)</label>`:''}<div class="actions"><button class="btn" type="submit">Save Profile</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div></form>`)}function saveEmployee(ev,uid){ev.preventDefault();let f=new FormData(ev.target),o={name:f.get('name').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),notes:f.get('notes').trim(),archived:f.has('archived')};if(uid)Object.assign(emp(uid),o);else db.employees.push({id:id(),...o});save();closeModal();render()}
function entryForm(uid,selectedJob){if(!db.jobs.length||!db.employees.length){alert('Add at least one job and one employee first.');return}let e=db.entries.find(e=>e.id===uid)||{};let jid=e.jobId||selectedJob||db.jobs[0].id;let defaultEmp=e.employeeId||db.employees.find(p=>!p.archived)?.id||db.employees[0].id;showModal(uid?'Edit Hours':'Record Hours',`<form onsubmit="saveEntry(event,'${uid||''}')"><label>Job *</label><select name="jobId">${db.jobs.map(j=>`<option value="${j.id}" ${j.id===jid?'selected':''}>${esc(jname(j))}</option>`).join('')}</select><label>Employee *</label><select name="employeeId">${db.employees.filter(p=>!p.archived||p.id===defaultEmp).map(p=>`<option value="${p.id}" ${p.id===defaultEmp?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Date *</label><input type="date" name="date" required value="${e.date||today()}"><div class="grid2"><div><label>Start (24-hour)</label><input type="time" name="start" required value="${e.start||'08:00'}"></div><div><label>End (24-hour)</label><input type="time" name="end" required value="${e.end||'16:00'}"></div></div><label>Comment (optional)</label><textarea name="comment">${esc(e.comment||'')}</textarea><div class="actions"><button class="btn" type="submit">Save Hours</button>${uid?`<button type="button" class="btn danger" onclick="deleteEntry('${uid}')">Delete Entry</button>`:''}</div></form>`)}function saveEntry(ev,uid){ev.preventDefault();let f=new FormData(ev.target);let o=Object.fromEntries(['jobId','employeeId','date','start','end','comment'].map(k=>[k,f.get(k)]));if(o.start===o.end){alert('Start and end times must differ.');return}if(uid)Object.assign(db.entries.find(e=>e.id===uid),o);else db.entries.push({id:id(),...o});save();closeModal();render()}function deleteEntry(uid){if(!confirm('Delete this time entry?'))return;db.entries=db.entries.filter(e=>e.id!==uid);save();closeModal();render()}
function renderEntries(){let es=entries().filter(e=>(!entryFilter||e.employeeId===entryFilter));$('app').innerHTML=`<div class="row"><h2>Entries</h2><button class="btn" onclick="entryForm()">+ Hours</button></div><label>Employee</label><select onchange="entryFilter=this.value;render()"><option value="">All employees</option>${db.employees.map(p=>`<option value="${p.id}" ${entryFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="card row"><b>Total recorded</b><b>${total(es)} hrs</b></div>${historyAll(es)}`}
function historyAll(es){if(!es.length)return '<div class="notice">No entries recorded.</div>';return Object.entries(byDate(es)).map(([date,items])=>`<div class="card"><div class="row"><b>${dateStr(date)}</b><b>${total(items)} hrs</b></div>${items.map(e=>`<div class="entry row"><div><b>${esc(emp(e.employeeId)?.name||'Unknown')}</b><div class="muted">${esc(jname(job(e.jobId)))}</div><div class="muted">${fmtTime(e.start)}–${fmtTime(e.end)}</div></div><div class="right"><b>${num(hrs(e))} hrs</b><br><button onclick="entryForm('${e.id}')">Edit</button></div></div>`).join('')}</div>`).join('')}
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];function periodLabel(){let start=db.settings.weekStart;return WEEKDAYS[start]+'–'+WEEKDAYS[(start+6)%7]}function setWeekStart(value){let n=Number(value);if(!Number.isInteger(n)||n<0||n>6)return;let old=db.settings.weekStart;db.settings.weekStart=n;if(!save()){db.settings.weekStart=old;render();return}periodShift=0;render()}
function periodDates(){let now=new Date(),day=now.getDay(),diff=(day-db.settings.weekStart+7)%7;let start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-diff+7*periodShift);let end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return [iso(start),iso(end)]}
function periodRows(){let [start,end]=periodDates();let es=[...db.entries].filter(e=>e.date>=start&&e.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));let groups={};es.forEach(e=>{let k=e.date+'|'+e.jobId;(groups[k]??=[]).push(e)});return Object.entries(groups).map(([key,items])=>({date:items[0].date,jobId:items[0].jobId,items}))}
function renderPeriods(){let [start,end]=periodDates();$('app').innerHTML=`<div class="row"><h2>Periods</h2><button class="btn secondary" onclick="exportSheet()">Export Image</button></div><div class="row"><button class="pill" onclick="periodShift--;render()">‹ Previous</button><button class="pill" onclick="periodShift=0;render()">Current</button><button class="pill" onclick="periodShift++;render()">Next ›</button></div><p class="muted">${periodLabel()} • Full pay-period snapshot</p><div id="sheet" class="sheet">${sheetHTML()}</div><p class="muted">The image export includes the complete timesheet, even if you scroll to view it on your phone.</p>`}
function sheetHTML(){let [start,end]=periodDates(),rows=periodRows(),people=db.employees.filter(p=>rows.some(r=>r.items.some(e=>e.employeeId===p.id)));if(!people.length)people=db.employees.filter(p=>!p.archived);let prev='',dayIndex=-1;return `<div class="sheet-title">EMPLOYEE TIMESHEET</div><div class="sheet-sub">${dateStr(start)} – ${dateStr(end)}</div><table class="timesheet"><colgroup><col class="jobcol">${people.map(()=>'<col class="timecol"><col class="hrscol">').join('')}</colgroup><thead><tr><th>DATE / JOB</th>${people.map(p=>`<th colspan="2">${esc(p.name.toUpperCase())}</th>`).join('')}</tr><tr><th></th>${people.map(()=>'<th>TIME</th><th>HRS</th>').join('')}</tr></thead><tbody>${rows.map(r=>{let newday=r.date!==prev;if(newday){prev=r.date;dayIndex++}return `<tr class="${dayIndex%2?'daydark':'daygray'} ${newday?'newday':''}"><td>${newday?`<div class="date">${dateStr(r.date)}</div>`:''}<div class="job">${esc(jname(job(r.jobId)))}</div></td>${people.map(p=>{let e=r.items.filter(e=>e.employeeId===p.id);return `<td>${e.map(x=>fmtTime(x.start)+'–'+fmtTime(x.end)).join('<br>')}</td><td class="num">${e.length?total(e):''}</td>`}).join('')}</tr>`}).join('')||`<tr class="daydark"><td colspan="${1+people.length*2}">No entries in this period</td></tr>`}</tbody><tfoot><tr><td>TOTAL HOURS</td>${people.map(p=>`<td colspan="2" class="num">${total(rows.flatMap(r=>r.items).filter(e=>e.employeeId===p.id))} hrs</td>`).join('')}</tr></tfoot></table>`}
function exportSheet(){let [start,end]=periodDates(),rows=periodRows(),people=db.employees.filter(p=>rows.some(r=>r.items.some(e=>e.employeeId===p.id)));if(!people.length)people=db.employees.filter(p=>!p.archived);const width=Math.max(920,410+people.length*260),jobW=410,pW=(width-jobW)/Math.max(1,people.length),lineH=25;const rowHeight=r=>Math.max(72,42+Math.max(0,...people.map(p=>r.items.filter(e=>e.employeeId===p.id).length-1))*lineH);let height=110+58+rows.reduce((s,r)=>s+rowHeight(r),0)+55+20;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#111315"/><style>text{font-family:Arial,sans-serif;fill:#fff} .sm{font-size:17px}.med{font-size:19px}.bold{font-weight:700}.storagebar{padding:8px 14px;background:#30363d;border-bottom:1px solid #58616b;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.storagebar button{background:#526579;border:1px solid #91a0af;color:#fff;border-radius:6px;padding:7px 10px;font-weight:700}.storagebar.warning{background:#633b31}.storagebar span{flex:1;min-width:160px}</style><text x="${width/2}" y="38" text-anchor="middle" font-size="25" font-weight="700">EMPLOYEE TIMESHEET</text><text x="${width/2}" y="70" text-anchor="middle" font-size="18" fill="#ddd">${dateStr(start)} – ${dateStr(end)}</text>`;const rect=(x,y,w,h,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#858c93" stroke-width="1.4"/>`;const txt=(x,y,s,extra='')=>`<text x="${x}" y="${y}" ${extra}>${esc(s)}</text>`;let y=95;svg+=rect(0,y,jobW,58,'#151719')+txt(14,y+35,'DATE / JOB','class="med bold"');people.forEach((p,i)=>{let x=jobW+i*pW;svg+=rect(x,y,pW,29,'#151719')+txt(x+pW/2,y+21,p.name.toUpperCase(),'class="med bold" text-anchor="middle"')+rect(x,y+29,pW*.7,29,'#151719')+rect(x+pW*.7,y+29,pW*.3,29,'#151719')+txt(x+12,y+49,'TIME','class="sm bold"')+txt(x+pW*.7+8,y+49,'HRS','class="sm bold"')});y+=58;let last='',idx=-1;rows.forEach(r=>{let fresh=r.date!==last;if(fresh){last=r.date;idx++}let h=rowHeight(r),fill=idx%2?'#151719':'#42464c';svg+=rect(0,y,jobW,h,fill);if(fresh)svg+=txt(14,y+24,dateStr(r.date),'class="med bold"');let name=jname(job(r.jobId)),max=42;for(let k=0;k<name.length;k+=max)svg+=txt(14,y+(fresh?49:27)+Math.floor(k/max)*20,name.slice(k,k+max),'class="sm"');people.forEach((p,i)=>{let x=jobW+i*pW;svg+=rect(x,y,pW*.7,h,fill)+rect(x+pW*.7,y,pW*.3,h,fill);let list=r.items.filter(e=>e.employeeId===p.id);list.forEach((e,k)=>svg+=txt(x+8,y+27+k*lineH,fmtTime(e.start)+'–'+fmtTime(e.end),'class="sm"'));if(list.length)svg+=txt(x+pW*.7+12,y+27,total(list),'class="med bold"')});y+=h});svg+=rect(0,y,jobW,55,'#555b62')+txt(14,y+34,'TOTAL HOURS','class="med bold"');people.forEach((p,i)=>{let x=jobW+i*pW;svg+=rect(x,y,pW,55,'#555b62')+txt(x+pW/2,y+35,total(rows.flatMap(r=>r.items).filter(e=>e.employeeId===p.id))+' hrs','class="med bold" text-anchor="middle"')});svg+='</svg>';let blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`crew-timesheet-${start}-to-${end}.svg`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function startClock(jid){if(!db.employees.length){alert('Add an employee first.');return}showModal('Clock In Now',`<label>Employee</label><select id="timerEmployee">${db.employees.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="notice">Start a timer for this employee and job. The timer is saved locally so you can return later.</div><div class="actions"><button class="btn" onclick="timerStart('${jid}')">Start Clock</button></div>`)}function timerStart(jid){let timers=JSON.parse(localStorage.getItem('crew-timers')||'[]');let p=$('timerEmployee').value;if(timers.some(t=>t.employeeId===p)){alert('This employee already has a running clock.');return}timers.push({id:id(),jobId:jid,employeeId:p,started:new Date().toISOString()});localStorage.setItem('crew-timers',JSON.stringify(timers));closeModal();render()}function stopTimer(uid){let timers=JSON.parse(localStorage.getItem('crew-timers')||'[]'),t=timers.find(x=>x.id===uid);if(!t)return;let a=new Date(t.started),b=new Date();if(a.toDateString()!==b.toDateString()){alert('This timer crosses midnight. Please enter its hours manually.');return}db.entries.push({id:id(),jobId:t.jobId,employeeId:t.employeeId,date:`${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`,start:`${String(a.getHours()).padStart(2,'0')}:${String(a.getMinutes()).padStart(2,'0')}`,end:`${String(b.getHours()).padStart(2,'0')}:${String(b.getMinutes()).padStart(2,'0')}`,comment:'Clocked time'});localStorage.setItem('crew-timers',JSON.stringify(timers.filter(x=>x.id!==uid)));save();render()}
function renderMore(){let timers=JSON.parse(localStorage.getItem('crew-timers')||'[]');$('app').innerHTML=`<h2>More</h2><div class="card"><h3>Running Clocks</h3>${timers.length?timers.map(t=>`<div class="row entry"><div><b>${esc(emp(t.employeeId)?.name||'Unknown')}</b><div class="muted">${esc(jname(job(t.jobId)))}</div><div class="muted">Started ${new Date(t.started).toLocaleString()}</div></div><button class="btn" onclick="stopTimer('${t.id}')">Clock Out</button></div>`).join(''):'<div class="muted">No active timers</div>'}</div><div class="card"><h3>Data & Backup</h3><p class="muted">Your data is stored on this device/browser. Export backups regularly. Clearing browser data may erase your records.</p><div class="actions"><button class="btn" onclick="backup()">Export Backup</button><button class="btn secondary" onclick="$('restoreFile').click()">Restore Backup</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></div><div class="card"><h3>Preferences</h3><p>Time: <b>24-hour military format</b></p><p>Date: <b>Wed 11 Nov 2026</b></p><label for="weekStart">Pay period starts on</label><select id="weekStart" onchange="setWeekStart(this.value)">${WEEKDAYS.map((d,i)=>`<option value="${i}" ${db.settings.weekStart===i?'selected':''}>${d}</option>`).join('')}</select><p>Pay period: <b>${periodLabel()}</b></p><p class="muted">Weekly • 7 days. Changes update the Periods tab without deleting hours. Previously exported timesheets are not changed.</p></div><div class="notice">Test version: manual entry, job and employee histories, pay-period image export, running clocks, and JSON backup. More features can be added after phone testing.</div>`}
function backup(){let payload={...db,activeTimers:JSON.parse(localStorage.getItem('crew-timers')||'[]')};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='crew-tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}async function restore(ev){let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.employees)||!Array.isArray(x.jobs)||!Array.isArray(x.entries))throw Error('Invalid backup');if(!confirm('Replace all current app data with this backup?'))return;let previous=db;db=x;if(!save()){db=previous;throw Error('Browser could not verify saving the restored data. Keep your backup file.')}if(Array.isArray(x.activeTimers))localStorage.setItem('crew-timers',JSON.stringify(x.activeTimers));render();alert('Backup restored and saved in current browser storage. Keep the backup file.')}catch(e){alert('Unable to restore backup: '+e.message)}}
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
